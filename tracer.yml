services:
  gel:
    image: geldata/gel
    environment:
      GEL_SERVER_INSTANCE_NAME: tracer-db
      GEL_SERVER_PASSWORD: password
      GEL_SERVER_ADMIN_UI: enabled
      GEL_SERVER_SECURITY: insecure_dev_mode
    volumes:
      - "./dbschema:/dbschema"
      - "./gel/data:/var/lib/gel/data"
    ports:
      - "5657:5656"
  tracer-backend:
    build:
      dockerfile: ./Dockerfile
      args:
        API_SERVER_URL_NO_TRAILING_SLASH: 'http://127.0.0.1:4200'
        FRONTEND_PUBLIC_URL_PATH_NO_TRAILING_SLASH: 'http://127.0.0.1:8081'
    environment:
      RUST_LOG: "tracer=info,tracer-backend=info"
      GEL_SERVER_INSTANCE_NAME: "tracer-db"
      GEL_DSN: "gel://admin:password@192.168.1.35:5656/main"
      GEL_CLIENT_SECURITY: "insecure_dev_mode"
    ports:
      - "4200:4200"


