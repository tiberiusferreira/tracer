[workspace]
resolver = "2"
members = [
    "tracer-backend",
    "tracer-ui",
    "api-structs",
    "tracing-config-helper",
    "tracked_error",
    "datetime-io-recorder",
    "gel-io-recorder",
]


[workspace.dependencies]
api-structs = { path = "./api-structs" }


tracked_error = { path = "./tracked_error", default-features = false }
tracing-config-helper = { path = "./tracing-config-helper" }
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
deepsize = "0.2.0"
serde_with = "3"
gel-tokio = { version = "0.10", features = ["unstable"] }
gel-protocol = { version = "0.8", features = ["with-chrono"] }
gel-errors = "0.5"
tracing = { version = "0.1", features = ["valuable"] }
tracing-subscriber = { version = "0.3", features = ['env-filter', 'json'] }
thiserror = "2"
futures = "0.3"
chrono = { version = "0.4", features = ['serde'] }
serde_json = "1"
reqwest = { version = "0.12", features = ['brotli', "json"] }
brotli = "8"
tokio = { version = "1", features = ["macros", "sync"] }
dotenvy = "0.15.7"
