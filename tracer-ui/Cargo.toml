[package]
name = "tracer-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
tracing.workspace = true
thiserror.workspace = true
tracked_error = { workspace = true, default-features = false, features = [] }
api-structs = { path = "../api-structs" }
console_error_panic_hook = "0.1"
tracing-subscriber-wasm = "0.1.0"
leptos = { version = "0.8.2", features = ["csr"] }
leptos_router = { version = "0.8.2" }
chrono = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6.0", features = ['http'] }
serde_json.workspace = true
#charming = { git = "https://github.com/yuankunzhang/charming", features = ["wasm"] }
charming = { version = "0.5.1", features = ["wasm"] }
tracing-subscriber = "0.3"
web-sys = { version = "0.3.77", features = ['DomRect', 'Element'] }
uuid = { workspace = true, features = ["js"] }
serde = { version = "1.0.219", features = ["derive"] }
wasm-bindgen = "0.2.100"
#serde_json.workspace = true
#charming = { path = "../../charming/charming", features = ["wasm"] }
#serde.workspace = true
