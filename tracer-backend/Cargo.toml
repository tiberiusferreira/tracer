[package]
name = "tracer-backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ['query', 'macros'] }
tower-http = { version = "0.6", features = ['limit', 'cors', 'fs', 'trace', 'decompression-br', 'compression-br', 'normalize-path'] }
tower-service = "0.3.3"
tokio = { version = "1", features = ["rt", "macros"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dotenvy.workspace = true
thiserror = { workspace = true }
serde.workspace = true
reqwest.workspace = true
chrono.workspace = true
base64.workspace = true
indexmap.workspace = true
http = "1"
tracer = { path = "../tracer" }
api-structs = { path = "../api-structs" }
tracked_error = { path = "../tracked_error" }
axum-io-provider = { path = "../io-providers/axum-io-provider" }

