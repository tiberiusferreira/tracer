[package]
name = "tracer-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
tracing.workspace = true
thiserror.workspace = true
tracked_error = { workspace = true, default-features = false, features = [] }
uuid = { workspace = true, features = ["js"] }
api-structs = { path = "../api-structs" }
console_error_panic_hook = "0.1"
tracing-subscriber-wasm = "0.1.0"
web-sys = { version = "0.3.73", features = ['DomRect', 'Element'] }
leptos = { version = "0.7.0", features = ["csr"] }
leptos_router = { version = "0.7.0" }
chrono = "0.4.38"
js-sys = "0.3.73"
wasm-bindgen = "0.2.96"
gloo-net = { version = "0.6.0", features = ['http'] }
charming = { version = "0.4.0", features = ["wasm"] }
#charming = { path = "../../charming/charming", features = ["wasm"] }
serde.workspace = true
serde_json.workspace = true
tracing-subscriber = "0.3.19"
