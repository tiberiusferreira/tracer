[package]
name = "tracer-backend"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json.workspace = true
uuid.workspace = true


gel-tokio.workspace = true
gel-protocol.workspace = true
function-timer = { path = "../function-timer" }
gel-io-recorder = { path = "../gel-io-recorder" }
axum = { version = "0.8", features = ['query', 'macros'] }
tower-http = { version = "0.6", features = ['limit', 'cors', 'fs', 'trace', 'decompression-br', 'compression-br', 'normalize-path'] }
tokio = { version = "1", features = ["rt", "macros"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
dotenvy.workspace = true
thiserror = { workspace = true }
serde.workspace = true
reqwest.workspace = true
chrono.workspace = true

api-structs = { path = "../api-structs" }
tracked_error = { path = "../tracked_error", features = ["gel-tokio"] }
tower = "0.5.2"
http = "1"
rand = "0.8.5"

[dependencies.tracing-config-helper]
version = "0.1.0"
path = "../tracing-config-helper"
